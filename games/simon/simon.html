html, body {
  background: #ccc;
}

#gameover, #youwon {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  display: none;
}
#gameover div, #youwon div {
  text-align: center;
  margin: 3vmin;
  font-size: 4vmin;
  font-family: "exo 2", "exo2", "exo", arial, sans-serif;
}

#simon {
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  width: 50vmin;
  height: 50vmin;
  background: #333;
  border-radius: 100%;
  box-shadow: inset 0.5vmin 0.5vmin 0.75vmin rgba(255, 255, 255, 0.2), inset 1vmin 1vmin 0.75vmin rgba(0, 0, 0, 0.15), inset -0.5vmin -0.5vmin 0.75vmin rgba(0, 0, 0, 0.2), inset -0.75vmin -0.75vmin 0.75vmin rgba(255, 255, 255, 0.1), 0.5vmin 0.5vmin 1.5vmin rgba(0, 0, 0, 0.2);
  overflow: hidden;
  aborder: 2vmin outset rgba(255, 255, 255, 0.1);
  box-sizing: border-box;
}

#protector {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  z-index: 4;
}

#center, #card {
  width: 40%;
  height: 40%;
  background: #333;
  position: absolute;
  border-radius: 100%;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  z-index: 5;
}

#card {
  width: 80%;
  height: 80%;
  background: #bbb;
  text-align: center;
}

#onoff {
  position: absolute;
  width: 30%;
  height: 15%;
  background: #222;
  border-radius: 1000px;
  position: absolute;
  top: 65%;
  left: 35%;
  box-shadow: inset 0 0 10px 0 black;
}

#switch {
  position: absolute;
  top: 7%;
  left: 7%;
  width: 43%;
  height: 86%;
  background: #999;
  border-radius: 100%;
  display: inline-block;
  transition: left 0.5s;
  cursor: pointer;
}

#cb-onoff:checked ~ #simon #switch {
  left: 53%;
}

h1, h2 {
  font-family: "exo 2", "exo2", "exo", arial, sans-serif;
  font-size: 3vmin;
  margin-top: 0;
  position: absolute;
  top: 35%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  color: #222;
  font-weight: 900;
  user-select: none;
}

h2 {
  font-size: 1.5vmin;
  top: 50%;
  font-weight: 400;
  white-space: nowrap;
}

#simon label.button {
  position: absolute;
  width: 43%;
  height: 43%;
  border: 0;
  box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
  outline: none;
  cursor: pointer;
  transition: all 0.25s;
  animation-timing-function: linear;
  animation-fill-mode: backwards;
  animation-delay: 0.5s;
}

label.button.incorrect {
  z-index: 2;
}

label.button.correct {
